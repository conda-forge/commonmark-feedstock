{% set version = "0.9.2" %}

package:
  name: commonmark
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/C/Commonmark/commonmark-{{ version }}.tar.gz
  sha256: 194d693e0c1ac49e83c26455bdeeb2483235e6280313c58b11d0b71c19f58ed1

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv"
  entry_points:
    - cmark = commonmark.cmark:main

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - future >=0.14.0

test:
  imports:
    - commonmark
    - commonmark.render
    - commonmark.tests
  requires:
    - flake8
    - hypothesis
    - python {{ python_min }}
  commands:
    - cmark --help

about:
  home: http://commonmark.org/
  license: BSD 3-Clause
  license_file: LICENSE
  license_family: BSD
  summary: 'Python parser for the CommonMark Markdown spec'
  description: |
    CommonMark-py is a pure Python port of jgm's commonmark.js, a Markdown
    parser and renderer for the CommonMark specification, using only native
    modules.
  dev_url: https://github.com/rtfd/CommonMark-py
  doc_url: https://commonmark-py.readthedocs.io

extra:
  recipe-maintainers:
    - ericmjl
    - dpryan79
